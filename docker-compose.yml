services:
  postgres:
    image: postgres:16-alpine
    container_name: metrc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metrc
    ports:
      - "5434:5432"
    volumes:
      - metrc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metrc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  metrc_pg_data:
